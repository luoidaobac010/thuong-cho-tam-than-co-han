<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper: 4-Way Logic</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>Minesweeper <span class="badge">4-Way</span></h1>
            <p>Built with 4-neighborhood solver algorithm</p>
        </header>

        <div class="game-info">
            <div class="stat-box">
                <span class="label">Mines</span>
                <span class="value" id="mine-count">0</span>
            </div>
            <div class="controls">
                <button id="btn-restart" class="btn primary">Restart</button>
                <button id="btn-solve" class="btn secondary">Auto-Solve</button>
            </div>
            <div class="stat-box">
                <span class="label">Time</span>
                <span class="value" id="timer">0</span>
            </div>
        </div>

        <div class="board-container">
            <div id="game-board"></div>
        </div>
        
        <div id="message-overlay" class="hidden">
            <h2 id="message-text">You Win!</h2>
            <button id="btn-play-again" class="btn primary">Play Again</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
